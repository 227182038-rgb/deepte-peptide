[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepte"
version = "0.1.0"
description = "Multi-modal deep learning for pan-cancer TE-derived cryptic peptide immunogenicity prediction"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "DeepTE-Peptide Research Team" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "torch>=2.1",
    "lightning>=2.2",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "biopython>=1.83",
    "pysam>=0.22",
    "pybedtools>=0.9",
    "mhcflurry>=2.0",
    "mlflow>=2.10",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "umap-learn>=0.5",
    "rich>=13.7",
    "tqdm>=4.66",
    "PyYAML>=6.0",
    "click>=8.1",
    "loguru>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=4.1", "jupyterlab>=4.0", "ruff>=0.2", "black>=24.1"]
gpu = ["bitsandbytes>=0.42", "accelerate>=0.27"]
viz  = ["plotly>=5.18", "bokeh>=3.3", "pysankey>=0.0.4"]

[project.scripts]
deepte-train = "deepte.training.train:main"
deepte-eval = "deepte.evaluation.evaluate:main"
deepte-predict = "deepte.cli.predict:main"
deepte-preprocess = "deepte.data.preprocess:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=deepte --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "RUF"]
ignore = ["N806", "N812"]

[tool.black]
line-length = 100
target-version = ["py310"]
