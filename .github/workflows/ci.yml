name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-cov
          pip install -e ".[dev]"

      - name: Run Ruff Linting
        run: |
          python -m ruff check src figures tests

      - name: Run Pytest
        run: |
          python -m pytest tests -v --cov=deepte --cov-report=xml --cov-report=term

      - name: Smoke test CLI inference
        run: |
          deepte-predict --config config/default.yaml --input data/sample/sample_teps.csv --output results/smoke_preds.csv --device cpu
