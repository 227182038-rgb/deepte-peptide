version: "3.9"

services:
  deepte:
    build:
      context: .
      dockerfile: Dockerfile
    image: deepte-peptide:latest
    container_name: deepte-peptide
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - PYTHONPATH=/app/src
      - DETERMINISTIC_CUDNN=1
      - CUBLAS_WORKSPACE_CONFIG=:4096:8
    volumes:
      - ./data:/app/data
      - ./results:/app/results
      - ./config:/app/config
      - ./scripts:/app/scripts
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    shm_size: 32gb
    mem_limit: 256g
    command: bash scripts/run_pipeline.sh

  jupyter:
    image: deepte-peptide:latest
    container_name: deepte-jupyter
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - ./data:/app/data
      - ./results:/app/results
      - ./notebooks:/app/notebooks
    ports:
      - "8888:8888"
    command: jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token=''

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.10.0
    container_name: deepte-mlflow
    ports:
      - "5000:5000"
    volumes:
      - ./results/mlruns:/mlruns
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri file:///mlruns --default-artifact-root file:///mlruns
