name: deepte
channels:
  - conda-forge
  - bioconda
  - pytorch
  - nvidia
dependencies:
  # Core Python
  - python=3.10.13
  - pip=23.3.1
  # Scientific stack
  - numpy=1.26.4
  - scipy=1.12.0
  - pandas=2.2.0
  - scikit-learn=1.4.0
  - statsmodels=0.14.1
  # PyTorch (CUDA 12.1)
  - pytorch=2.2.0
  - pytorch-cuda=12.1
  - torchvision=0.17.0
  - torchaudio=2.2.0
  # Bioinformatics
  - samtools=1.18
  - bedtools=2.41.0
  - htslib=1.18
  - repeatmasker=4.0.14
  - hmmer=3.3.2
  - blast=2.14.0
  - viennarna=2.6.4
  # R for statistical analysis
  - r-base=4.3.2
  - r-tidyverse=2.0.0
  - r-survival=3.5.7
  - r-survminer=0.4.9
  - r-limma=3.58.0
  - r-edger=4.0.0
  - r-clusterprofiler=4.10.0
  - r-ggplot2=3.5.0
  - r-cowplot=1.1.3
  # Build tools
  - cmake=3.28.1
  - make=4.3
  - gcc=12.3.0
  # Misc
  - jupyterlab=4.1.0
  - ipykernel=6.29.0
  - pytest=8.0.0
  - pytest-cov=4.1.0
  - snakemake=8.4.0
  - pip:
    # Deep learning extras
    - transformers==4.38.0
    - datasets==2.17.0
    - accelerate==0.27.0
    - peft==0.8.0
    - bitsandbytes==0.42.0
    - lightning==2.2.0
    - hydra-core==1.3.2
    - omegaconf==2.3.0
    # Bioinformatics Python
    - biopython==1.83
    - pysam==0.22.1
    - pybedtools==0.9.1
    - pyfaidx==0.8.0
    - mappy==2.26
    - esm==2.0.0
    - fair-esm==2.0.0
    # MHC binding
    - mhcflurry==2.0.6
    # Tracking
    - mlflow==2.10.0
    - wandb==0.16.2
    - tensorboard==2.15.1
    # Visualization
    - matplotlib==3.8.2
    - seaborn==0.13.2
    - plotly==5.18.0
    - pysankey==0.0.4
    - umap-learn==0.5.5
    - bokeh==3.3.3
    # Utilities
    - rich==13.7.0
    - tqdm==4.66.1
    - pyyaml==6.0.1
    - click==8.1.7
    - loguru==0.7.2
    - requests==2.31.0
    - aiohttp==3.9.3
    # Reproducibility
    - papermill==2.5.0
    - dvc==3.48.0
